<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Abdelrahman El-Assiouty's Portfolio">
    <meta name="keywords"
        content="Abdelrahman El-Assiouty, Front-End Developer, React.js, TypeScript, Tailwind CSS, Luxor Egypt, Web Development, Single Page Applications, UI/UX Design, عبدالرحمن الأسيوطي, مطور واجهات أمامیة, الأقصر">
    <title>Login | Abdelrahman El-Assiouty</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="neural-network"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Logo & Back Button -->
        <div class="login-header">
            <a href="index.html" class="back-button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Back to Portfolio</span>
            </a>
            <div class="logo">
                <img src="hero-banner.png" alt="Abdelrahman El-Assiouty" class="brand-avatar-mini">
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="card-header">
                <img src="aaa.jpeg" alt="Abdelrahman El-Assiouty" class="card-avatar">
                <h1 class="card-title">Welcome Back</h1>
                <p class="card-subtitle">Sign in to access your account</p>
            </div>

            <!-- Google OAuth Button (Available for both Login and Signup) -->
            <div class="oauth-section">
                <button type="button" class="google-btn" id="google-btn">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span id="google-btn-label">Continue with Google</span>
                </button>
            </div>

            <div class="divider">
                <span class="divider-text" id="or-divider-text">or continue with email</span>
            </div>

            <!-- Alert Messages -->
            <div id="alert-container" class="alert-container hidden">
                <div id="alert-message" class="alert">
                    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2" />
                        <line x1="12" y1="8" x2="12" y2="12" stroke-width="2" stroke-linecap="round" />
                        <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <div class="alert-content">
                        <p class="alert-text"></p>
                    </div>
                    <button class="alert-close" onclick="closeAlert()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="18" y1="6" x2="6" y2="18" stroke-width="2" stroke-linecap="round" />
                            <line x1="6" y1="6" x2="18" y2="18" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                                stroke-width="2" />
                            <polyline points="22,6 12,13 2,6" stroke-width="2" />
                        </svg>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="your.email@example.com"
                        required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-width="2" />
                        </svg>
                        Password
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-width="2" />
                                <circle cx="12" cy="12" r="3" stroke-width="2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader hidden">
                        <div class="spinner"></div>
                    </div>
                </button>

            </form>

            <!-- Divider -->
            <div class="divider">
                <span class="divider-text">Don't have an account?</span>
            </div>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form hidden">
                <!-- Username input -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Username
                    </label>
                    <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
                </div>

                <!-- Phone & Country Group -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="country" class="form-label">المحافظة (Governorate)</label>
                        <select id="country" class="form-input">
                            <option value="Cairo">القاهرة - Cairo</option>
                            <option value="Giza">الجيزة - Giza</option>
                            <option value="Alexandria">الإسكندرية - Alexandria</option>
                            <option value="Luxor" selected>الأقصر - Luxor</option>
                            <option value="Aswan">أسوان - Aswan</option>
                            <option value="Qena">قنا - Qena</option>
                            <option value="Sohag">سوهاج - Sohag</option>
                            <option value="Assiut">أسيوط - Assiut</option>
                            <option value="Minya">المنيا - Minya</option>
                            <option value="Beni Suef">بني سويف - Beni Suef</option>
                            <option value="Fayoum">الفيوم - Fayoum</option>
                            <option value="Qalyubia">القليوبية - Qalyubia</option>
                            <option value="Sharqia">الشرقية - Sharqia</option>
                            <option value="Dakahlia">الدقهلية - Dakahlia</option>
                            <option value="Monufia">المنوفية - Monufia</option>
                            <option value="Gharbia">الغربية - Gharbia</option>
                            <option value="Kafr El Sheikh">كفر الشيخ - Kafr El Sheikh</option>
                            <option value="Damietta">دمياط - Damietta</option>
                            <option value="Port Said">بورسعيد - Port Said</option>
                            <option value="Ismailia">الإسماعيلية - Ismailia</option>
                            <option value="Suez">السويس - Suez</option>
                            <option value="North Sinai">شمال سيناء - North Sinai</option>
                            <option value="South Sinai">جنوب سيناء - South Sinai</option>
                            <option value="Red Sea">البحر الأحمر - Red Sea</option>
                            <option value="New Valley">الوادي الجديد - New Valley</option>
                            <option value="Matrouh">مطروح - Matrouh</option>
                            <option value="Beheira">البحيرة - Beheira</option>
                            <option value="Outside Egypt">خارج مصر - Outside Egypt 🌍</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" id="phone" class="form-input" placeholder="01xxxxxxxxx">
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-email" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                                stroke-width="2" />
                            <polyline points="22,6 12,13 2,6" stroke-width="2" />
                        </svg>
                        Email Address
                    </label>
                    <input type="email" id="signup-email" name="email" class="form-input"
                        placeholder="your.email@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="signup-password" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-width="2" />
                        </svg>
                        Password
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="signup-password" name="password" class="form-input"
                            placeholder="At least 6 characters" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signup')">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-width="2" />
                                <circle cx="12" cy="12" r="3" stroke-width="2" />
                            </svg>
                        </button>
                    </div>
                    <p class="form-hint">Password must be at least 6 characters</p>
                </div>

                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span class="btn-text">Create Account</span>
                    <div class="btn-loader hidden">
                        <div class="spinner"></div>
                    </div>
                </button>
            </form>

            <!-- Toggle Button -->
            <button class="btn btn-secondary" id="toggle-form-btn" onclick="toggleForm()">
                <span id="toggle-text">Create New Account</span>
            </button>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <p>&copy; 2026 Abdelrahman El-Assiouty. Secured by Supabase.</p>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Authentication Script (Standalone - works without server) -->
    <script src="auth-standalone.js"></script>
</body>

</html>
