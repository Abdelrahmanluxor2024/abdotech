<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0a0a0f; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 960px; margin: 0 auto; }

        /* ===== LOGIN ===== */
        #login-section {
            max-width: 400px;
            margin: 80px auto;
            background: rgba(26,26,36,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 36px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #dashboard-section { display: none; }

        .login-icon { font-size: 2.5rem; text-align: center; margin-bottom: 10px; }
        .login-title { text-align: center; font-size: 1.6rem; color: #667eea; margin-bottom: 6px; }
        .login-sub   { text-align: center; color: #a0a0b8; font-size: 0.9rem; margin-bottom: 26px; }

        .form-group  { margin-bottom: 18px; }
        .form-label  { display: block; font-size: 0.88rem; color: #a0a0b8; margin-bottom: 7px; }
        .form-input  {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #fff; font-size: 1rem; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #667eea; box-shadow: 0 0 10px rgba(102,126,234,0.3); }

        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; border-radius: 10px; color: #fff;
            font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-login:hover { opacity: 0.92; transform: translateY(-2px); }
        .btn-login:active { transform: translateY(0); }

        .error-box {
            display: none;
            margin-top: 14px; padding: 12px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px; color: #f87171;
            text-align: center; font-size: 0.9rem;
        }

        /* ===== DASHBOARD ===== */
        .dash-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 28px;
        }
        .dash-title { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .dash-badge {
            font-size: 0.78rem; color: #667eea;
            background: rgba(102,126,234,0.15);
            padding: 4px 12px; border-radius: 20px;
        }
        .btn-out {
            padding: 9px 18px;
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-out:hover { background: #ef4444; color: #fff; }

        .section-heading { font-size: 1.15rem; color: #667eea; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

        /* ===== COMMENT CARD ===== */
        .c-card {
            background: rgba(26,26,36,0.85);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 20px;
            margin-bottom: 20px;
        }
        .c-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .c-user { display: flex; align-items: center; gap: 10px; }
        .c-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
        .c-name  { font-weight: 700; font-size: 1rem; }
        .c-date  { font-size: 0.78rem; color: #a0a0b8; margin-top: 2px; }
        .c-body  {
            font-size: 0.95rem; line-height: 1.6; color: #e2e8f0;
            background: rgba(255,255,255,0.03); padding: 12px 14px;
            border-radius: 8px; margin-bottom: 14px;
        }
        .existing-reply {
            background: rgba(102,126,234,0.1);
            border-right: 3px solid #667eea;
            border-radius: 8px; padding: 12px 14px;
            margin-bottom: 14px;
        }
        .existing-reply span { font-size: 0.8rem; font-weight: 700; color: #667eea; display: block; margin-bottom: 4px; }
        .existing-reply p    { color: #e2e8f0; margin: 0; font-size: 0.93rem; }

        .reply-row { display: flex; gap: 10px; }
        .reply-input {
            flex: 1; padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px; color: #fff;
            font-size: 0.92rem; outline: none;
        }
        .reply-input:focus { border-color: #667eea; }
        .btn-reply {
            padding: 10px 20px; background: #667eea; color: #fff;
            border: none; border-radius: 8px; font-weight: 700;
            cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .btn-reply:hover { background: #5a6fd6; }
        .btn-del {
            padding: 10px 14px;
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-del:hover { background: #ef4444; color: #fff; }

        .empty-state {
            text-align: center; color: #a0a0b8; padding: 40px 20px;
            background: rgba(26,26,36,0.6);
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 14px;
        }
        .loading { text-align: center; color: #a0a0b8; padding: 30px; }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== LOGIN ===== -->
    <div id="login-section">
        <div class="login-icon">🛡️</div>
        <h2 class="login-title">لوحة الإدارة</h2>
        <p class="login-sub">سجل الدخول للمتابعة والرد على تعليقات الزوار</p>
        <form id="admin-form" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="a-user">اسم المستخدم</label>
                <input type="text" id="a-user" class="form-input" placeholder="أدخل اسم المستخدم" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="a-pass">كلمة المرور</label>
                <input type="password" id="a-pass" class="form-input" placeholder="أدخل كلمة المرور" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
            <div class="error-box" id="err-box">❌ اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </form>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard-section">
        <div class="dash-header">
            <h1 class="dash-title">
                <span>تعليقات كتاب الزوار</span>
                <span class="dash-badge">Admin Mode 🛡️</span>
            </h1>
            <button class="btn-out" id="logout-btn">تسجيل الخروج</button>
        </div>
        <div class="section-heading">💬 جميع التعليقات الواردة</div>
        <div id="c-list"><div class="loading">جاري تحميل التعليقات...</div></div>
    </div>

</div>

<!-- Firebase SDKs (no Auth needed for admin panel) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // ===== FIREBASE INIT =====
    var firebaseConfig = {
        apiKey: "AIzaSyD_orcnGOH8XS6zY5Ii5379owwYZDZ8Yh4",
        authDomain: "me-web-f4e3a.firebaseapp.com",
        projectId: "me-web-f4e3a",
        storageBucket: "me-web-f4e3a.firebasestorage.app",
        messagingSenderId: "134789019215",
        appId: "1:134789019215:web:f6c92ddc53f3388dd99c3a"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.firestore();

    // ===== ADMIN CREDENTIALS =====
    var ADMIN_USER = 'liger';
    var ADMIN_PASS = 'S@nDisk0';

    // ===== DOM =====
    var loginSection    = document.getElementById('login-section');
    var dashSection     = document.getElementById('dashboard-section');
    var adminForm       = document.getElementById('admin-form');
    var errBox          = document.getElementById('err-box');
    var logoutBtn       = document.getElementById('logout-btn');
    var cList           = document.getElementById('c-list');

    // ===== AUTH CHECK =====
    function isLoggedIn() {
        return sessionStorage.getItem('admin_ok') === '1';
    }

    function showLogin() {
        loginSection.style.display = 'block';
        dashSection.style.display  = 'none';
    }

    function showDash() {
        loginSection.style.display = 'none';
        dashSection.style.display  = 'block';
        loadComments();
    }

    // ===== LOGIN FORM =====
    adminForm.addEventListener('submit', function(e) {
        e.preventDefault();
        errBox.style.display = 'none';

        var u = document.getElementById('a-user').value.trim();
        var p = document.getElementById('a-pass').value;

        if (u === ADMIN_USER && p === ADMIN_PASS) {
            sessionStorage.setItem('admin_ok', '1');
            showDash();
        } else {
            errBox.style.display = 'block';
        }
    });

    // ===== LOGOUT =====
    logoutBtn.addEventListener('click', function() {
        sessionStorage.removeItem('admin_ok');
        showLogin();
    });

    // ===== ESCAPE HTML =====
    function esc(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, function(t) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t;
        });
    }

    // ===== LOAD COMMENTS (REALTIME) =====
    var unsubscribe = null;
    function loadComments() {
        if (unsubscribe) unsubscribe();
        cList.innerHTML = '<div class="loading">⏳ جاري التحميل...</div>';

        unsubscribe = db.collection('comments')
            .orderBy('created_at', 'desc')
            .onSnapshot(function(snap) {
                if (snap.empty) {
                    cList.innerHTML = '<div class="empty-state">📭 لا توجد تعليقات حتى الآن.</div>';
                    return;
                }
                cList.innerHTML = '';
                snap.forEach(function(doc) {
                    var c   = doc.data();
                    var id  = doc.id;
                    var dt  = (c.created_at && c.created_at.toDate)
                        ? c.created_at.toDate().toLocaleString('ar-EG')
                        : 'منذ قليل';
                    var av  = c.avatar_url ||
                        'https://ui-avatars.com/api/?name=' + encodeURIComponent(c.username || 'User') + '&background=6366f1&color=fff';

                    var replyHtml = '';
                    if (c.admin_reply) {
                        replyHtml =
                            '<div class="existing-reply">' +
                                '<span>رد الإدارة الحالي:</span>' +
                                '<p>' + esc(c.admin_reply) + '</p>' +
                            '</div>';
                    }

                    var card = document.createElement('div');
                    card.className = 'c-card';
                    card.innerHTML =
                        '<div class="c-card-top">' +
                            '<div class="c-user">' +
                                '<img src="' + esc(av) + '" class="c-avatar" alt="">' +
                                '<div>' +
                                    '<div class="c-name">' + esc(c.username || 'زائر') + '</div>' +
                                    '<div class="c-date">' + dt + '</div>' +
                                '</div>' +
                            '</div>' +
                            '<button class="btn-del" onclick="delComment(\'' + id + '\')">حذف 🗑️</button>' +
                        '</div>' +
                        '<div class="c-body">' + esc(c.comment_text) + '</div>' +
                        replyHtml +
                        '<form class="reply-row" onsubmit="sendReply(event,\'' + id + '\')">' +
                            '<input type="text" class="reply-input" placeholder="اكتب ردك هنا..." ' +
                                'value="' + esc(c.admin_reply || '') + '">' +
                            '<button type="submit" class="btn-reply">' +
                                (c.admin_reply ? 'تحديث الرد ✍️' : 'إرسال 🚀') +
                            '</button>' +
                        '</form>';

                    cList.appendChild(card);
                });
            }, function(err) {
                cList.innerHTML = '<div class="empty-state" style="color:#f87171">❌ خطأ في التحميل: ' + err.message + '</div>';
            });
    }

    // ===== SEND REPLY =====
    window.sendReply = async function(e, id) {
        e.preventDefault();
        var input = e.target.querySelector('.reply-input');
        var text  = input.value.trim();
        if (!text) return;
        var btn = e.target.querySelector('.btn-reply');
        btn.disabled = true;
        btn.textContent = 'جاري الحفظ...';
        try {
            await db.collection('comments').doc(id).update({
                admin_reply: text,
                reply_at: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch(err) {
            alert('فشل الحفظ: ' + err.message);
            btn.disabled = false;
            btn.textContent = 'إرسال 🚀';
        }
    };

    // ===== DELETE COMMENT =====
    window.delComment = async function(id) {
        if (!confirm('هل أنت متأكد من حذف هذا التعليق؟')) return;
        try {
            await db.collection('comments').doc(id).delete();
        } catch(err) {
            alert('فشل الحذف: ' + err.message);
        }
    };

    // ===== INIT =====
    if (isLoggedIn()) {
        showDash();
    } else {
        showLogin();
    }
</script>
</body>
</html>
