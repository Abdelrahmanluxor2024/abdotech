<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الملف الشخصي وإدارة الحساب - عبدالرحمن الأسيوطي">
    <title>الملف الشخصي | My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <div class="profile-container">
        <!-- Navigation -->
        <nav class="nav-bar">
            <a href="index.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                <span>العودة إلى الصفحة الرئيسية</span>
            </a>
            <button id="sign-out-btn" class="sign-out-btn" type="button">تسجيل الخروج</button>
        </nav>

        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar-wrapper" id="avatar-container" title="اضغط لاختيار صورة من جهازك أو الموبايل">
                <!-- Native File Input sits on top of avatar for 100% reliable tap/click on all devices -->
                <input type="file" id="avatar-file-input" accept="image/*" title="اضغط لاختيار صورة">
                <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Avatar"
                    id="avatar-img" class="profile-avatar">
                <span class="avatar-upload-btn" title="تغيير الصورة">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </span>
            </div>

            <div class="profile-info">
                <h1 id="display-name">مستخدم مسجل</h1>
                <p class="profile-email">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <span id="display-email"></span>
                </p>
                <span class="profile-badge" id="account-badge">حساب نشط ✓</span>
            </div>
        </div>

        <!-- Personal Information Form -->
        <div class="profile-card">
            <h2>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>البيانات الشخصية</span>
            </h2>

            <form id="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="username">اسم المستخدم (Username)</label>
                        <input type="text" id="username" class="form-input" placeholder="اسم المستخدم" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="full_name">الاسم بالكامل (Full Name)</label>
                        <input type="text" id="full_name" class="form-input" placeholder="الاسم ثلاثي أو ثنائي">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">رقم الهاتف / الواتساب</label>
                        <input type="tel" id="phone" class="form-input" placeholder="01xxxxxxxxx" dir="ltr" style="text-align: right;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="country">المحافظة (Governorate)</label>
                        <select id="country" class="form-input">
                            <option value="Cairo">القاهرة (Cairo)</option>
                            <option value="Giza">الجيزة (Giza)</option>
                            <option value="Alexandria">الإسكندرية (Alexandria)</option>
                            <option value="Luxor" selected>الأقصر (Luxor)</option>
                            <option value="Aswan">أسوان (Aswan)</option>
                            <option value="Qena">قنا (Qena)</option>
                            <option value="Sohag">سوهاج (Sohag)</option>
                            <option value="Assiut">أسيوط (Assiut)</option>
                            <option value="Minya">المنيا (Minya)</option>
                            <option value="Beni Suef">بني سويف (Beni Suef)</option>
                            <option value="Fayoum">الفيوم (Fayoum)</option>
                            <option value="Qalyubia">القليوبية (Qalyubia)</option>
                            <option value="Sharqia">الشرقية (Sharqia)</option>
                            <option value="Dakahlia">الدقهلية (Dakahlia)</option>
                            <option value="Monufia">المنوفية (Monufia)</option>
                            <option value="Gharbia">الغربية (Gharbia)</option>
                            <option value="Kafr El Sheikh">كفر الشيخ (Kafr El Sheikh)</option>
                            <option value="Damietta">دمياط (Damietta)</option>
                            <option value="Port Said">بورسعيد (Port Said)</option>
                            <option value="Ismailia">الإسماعيلية (Ismailia)</option>
                            <option value="Suez">السويس (Suez)</option>
                            <option value="North Sinai">شمال سيناء (North Sinai)</option>
                            <option value="South Sinai">جنوب سيناء (South Sinai)</option>
                            <option value="Red Sea">البحر الأحمر (Red Sea)</option>
                            <option value="New Valley">الوادي الجديد (New Valley)</option>
                            <option value="Matrouh">مطروح (Matrouh)</option>
                            <option value="Beheira">البحيرة (Beheira)</option>
                            <option value="Outside Egypt">خارج مصر (Outside Egypt 🌍)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-save" id="save-btn">حفظ التغييرات</button>
            </form>
        </div>
    </div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- MAIN PROFILE SCRIPT (FIREBASE) -->
    <script>
        // Firebase references (firebase-config.js initialized the app)
        var auth = firebase.auth();
        var db   = firebase.firestore();

        let activeProfile = {
            id: 'default_user',
            uid: '',
            email: '',
            username: '',
            full_name: '',
            phone: '',
            country: 'Luxor',
            avatar_url: ''
        };

        // Toast Message Notification
        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 350);
            }, 3500);
        }

        // Apply profile values into UI elements
        function applyProfileToDOM(p) {
            if (!p) return;

            const nameEl = document.getElementById('display-name');
            const emailEl = document.getElementById('display-email');
            const usernameInput = document.getElementById('username');
            const fullNameInput = document.getElementById('full_name');
            const phoneInput = document.getElementById('phone');
            const countrySelect = document.getElementById('country');
            const avatarImg = document.getElementById('avatar-img');

            const displayName = p.username || p.full_name || (p.email ? p.email.split('@')[0] : 'مستخدم مسجل');
            if (nameEl) nameEl.textContent = displayName;
            if (emailEl) emailEl.textContent = p.email || 'حساب مفعل';

            if (usernameInput) usernameInput.value = p.username || (p.email ? p.email.split('@')[0] : '');
            if (fullNameInput) fullNameInput.value = p.full_name || p.username || '';
            if (phoneInput) phoneInput.value = p.phone || '';

            if (countrySelect && p.country) {
                for (let i = 0; i < countrySelect.options.length; i++) {
                    if (countrySelect.options[i].value.toLowerCase() === p.country.toLowerCase()) {
                        countrySelect.selectedIndex = i;
                        break;
                    }
                }
            }

            // Avatar resolution
            const savedAvatar = localStorage.getItem('user_avatar') ||
                                localStorage.getItem('user_avatar_global') ||
                                (p.id ? localStorage.getItem('user_avatar_' + p.id) : null) ||
                                p.avatar_url;

            if (avatarImg) {
                if (savedAvatar) {
                    avatarImg.src = savedAvatar;
                } else {
                    avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=6366f1&color=fff`;
                }
            }
        }

        // 1. Instant Load from Local Storage Cache
        function loadAllStorageData() {
            try {
                const s = localStorage.getItem('active_user_session');
                if (s) {
                    const parsed = JSON.parse(s);
                    if (parsed) Object.assign(activeProfile, parsed);
                }
            } catch(e) {}

            const sEmail = localStorage.getItem('saved_user_email');
            const sName  = localStorage.getItem('saved_user_name');
            const sPhone = localStorage.getItem('saved_user_phone');
            const sGov   = localStorage.getItem('saved_user_gov');

            if (sEmail && !activeProfile.email) activeProfile.email = sEmail;
            if (sName && !activeProfile.username) activeProfile.username = sName;
            if (sPhone && !activeProfile.phone) activeProfile.phone = sPhone;
            if (sGov && !activeProfile.country) activeProfile.country = sGov;

            applyProfileToDOM(activeProfile);
        }

        // 2. Fetch Live User Profile from Firebase & Firestore
        function initFirebaseProfile() {
            auth.onAuthStateChanged(async function(user) {
                if (user) {
                    activeProfile.id = user.uid;
                    activeProfile.uid = user.uid;
                    activeProfile.email = user.email || activeProfile.email || '';
                    if (!activeProfile.username) {
                        activeProfile.username = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
                    }
                    if (user.photoURL && !activeProfile.avatar_url) {
                        activeProfile.avatar_url = user.photoURL;
                    }

                    // Render immediately with auth data
                    applyProfileToDOM(activeProfile);

                    // Fetch latest from Firestore document
                    try {
                        const doc = await db.collection('users').doc(user.uid).get();
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.username) activeProfile.username = data.username;
                            if (data.full_name) activeProfile.full_name = data.full_name;
                            if (data.phone) activeProfile.phone = data.phone;
                            if (data.country) activeProfile.country = data.country;
                            if (data.avatar_url) activeProfile.avatar_url = data.avatar_url;
                            applyProfileToDOM(activeProfile);
                        }
                    } catch(err) {
                        console.warn('Firestore user fetch notice:', err);
                    }

                    localStorage.setItem('active_user_session', JSON.stringify(activeProfile));
                    applyProfileToDOM(activeProfile);
                } else {
                    // Check if local cache exists
                    const cached = localStorage.getItem('active_user_session');
                    if (cached) {
                        applyProfileToDOM(JSON.parse(cached));
                    } else {
                        // User not authenticated
                        window.location.replace('login.html');
                    }
                }
            });
        }

        // 3. Avatar Upload Handler
        const fileInput = document.getElementById('avatar-file-input');
        const avatarImg = document.getElementById('avatar-img');

        if (fileInput) {
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showToast('يرجى اختيار ملف صورة صالح (PNG, JPG, WEBP)', 'error');
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    showToast('حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = async function(evt) {
                    const base64Data = evt.target.result;
                    if (avatarImg) avatarImg.src = base64Data;

                    activeProfile.avatar_url = base64Data;
                    const userId = activeProfile.id || (auth.currentUser ? auth.currentUser.uid : 'default_user');

                    localStorage.setItem('user_avatar', base64Data);
                    localStorage.setItem('user_avatar_global', base64Data);
                    localStorage.setItem('user_avatar_' + userId, base64Data);
                    localStorage.setItem('active_user_session', JSON.stringify(activeProfile));

                    if (auth.currentUser) {
                        try {
                            await db.collection('users').doc(auth.currentUser.uid).set({
                                avatar_url: base64Data,
                                updated_at: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });
                        } catch(e) {}
                    }

                    showToast('تم تحديث الصورة الشخصية بنجاح! ✅', 'success');
                };
                reader.readAsDataURL(file);
            });
        }

        // 4. Save Profile Changes Handler
        const profileForm = document.getElementById('profile-form');
        if (profileForm) {
            profileForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const saveBtn = document.getElementById('save-btn');
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.textContent = 'جاري الحفظ...';
                }

                const usernameVal = document.getElementById('username').value.trim();
                const fullNameVal = document.getElementById('full_name').value.trim();
                const phoneVal = document.getElementById('phone').value.trim();
                const countryVal = document.getElementById('country').value;
                const avatarVal = avatarImg ? avatarImg.src : '';

                activeProfile.username = usernameVal || activeProfile.username;
                activeProfile.full_name = fullNameVal;
                activeProfile.phone = phoneVal;
                activeProfile.country = countryVal;
                if (avatarVal) activeProfile.avatar_url = avatarVal;

                // Save locally
                localStorage.setItem('active_user_session', JSON.stringify(activeProfile));
                localStorage.setItem('saved_user_name', activeProfile.username);
                localStorage.setItem('saved_user_phone', activeProfile.phone);
                localStorage.setItem('saved_user_gov', activeProfile.country);

                // Save to Firebase Firestore
                if (auth.currentUser) {
                    try {
                        await db.collection('users').doc(auth.currentUser.uid).set({
                            username: activeProfile.username,
                            full_name: activeProfile.full_name,
                            phone: activeProfile.phone,
                            country: activeProfile.country,
                            avatar_url: activeProfile.avatar_url,
                            updated_at: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });

                        if (auth.currentUser.updateProfile) {
                            await auth.currentUser.updateProfile({
                                displayName: activeProfile.username
                            });
                        }
                    } catch(err) {
                        console.warn('Firestore update notice:', err);
                    }
                }

                applyProfileToDOM(activeProfile);

                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'حفظ التغييرات';
                }

                showToast('تم حفظ التعديلات بنجاح! ✅', 'success');
            });
        }

        // 5. Sign Out Handler
        const signOutBtn = document.getElementById('sign-out-btn');
        if (signOutBtn) {
            signOutBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                signOutBtn.textContent = 'جاري الخروج...';
                signOutBtn.disabled = true;

                try {
                    await auth.signOut();
                } catch(e) {}

                localStorage.removeItem('active_user_session');
                localStorage.removeItem('saved_user_email');
                localStorage.removeItem('saved_user_name');
                localStorage.removeItem('saved_user_phone');
                localStorage.removeItem('saved_user_gov');
                localStorage.removeItem('user_avatar');
                localStorage.removeItem('user_avatar_global');
                sessionStorage.clear();

                window.location.replace('login.html');
            });
        }

        // Initialization
        loadAllStorageData();
        initFirebaseProfile();

    </script>
</body>

</html>
