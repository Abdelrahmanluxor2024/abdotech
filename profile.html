<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your profile on Abdelrahman El-Assiouty's Portfolio.">
    <meta name="keywords"
        content="Abdelrahman El-Assiouty, Front-End Developer, React.js, TypeScript, Tailwind CSS, Luxor Egypt, Web Development, Single Page Applications, UI/UX Design, عبدالرحمن الأسيوطي, مطور واجهات أمامیة, الأقصر">
    <title>My Profile | Abdelrahman El-Assiouty</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="profile-container">
        <nav class="nav-bar">
            <a href="index.html" class="back-btn">← Back to Home</a>
            <button id="sign-out-btn" class="sign-out-btn">Sign Out</button>
        </nav>

        <div class="profile-header">
            <div class="avatar-wrapper">
                <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Avatar"
                    id="avatar-img" class="profile-avatar" title="Click to change profile picture">
                <button type="button" class="avatar-upload-btn" id="upload-btn" title="Change Avatar">📷</button>
                <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
            </div>
            <div class="profile-info">
                <h1 id="display-name">Loading...</h1>
                <p class="profile-email" id="display-email">user@example.com</p>
            </div>
        </div>

        <div class="profile-card">
            <h2>Personal Information</h2>
            <form id="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="Username">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="full_name" class="form-input" placeholder="Full Name">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-input" placeholder="01xxxxxxxxx">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Country</label>
                        <select id="country" class="form-input">
                            <option value="Egypt">Egypt 🇪🇬</option>
                            <option value="Saudi Arabia">Saudi Arabia 🇸🇦</option>
                            <option value="UAE">UAE 🇦🇪</option>
                            <option value="Kuwait">Kuwait 🇰🇼</option>
                            <option value="USA">USA 🇺🇸</option>
                            <option value="Other">Other 🌍</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        // --- Supabase Config ---
        const SUPABASE_URL = 'https://bebudhdiylpxrmddrhyp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlYnVkaGRpeWxweHJtZGRyaHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0ODI4NTksImV4cCI6MjA5ODA1ODg1OX0.LB6-Tg7QdOertHK3eEue966iblIgVzO7982-WAg2bVM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        async function loadProfile() {
            // 1. Get User
            try {
                const { data } = await supabase.auth.getUser();
                if (data && data.user) {
                    currentUser = data.user;
                }
            } catch (e) {
                console.warn('Supabase getUser error:', e);
            }

            if (!currentUser) {
                const googleAuth = localStorage.getItem('google_auth_user');
                if (googleAuth) {
                    try {
                        const parsed = JSON.parse(googleAuth);
                        currentUser = parsed.user;
                    } catch (e) {}
                }
            }

            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // Display user email
            const userEmail = currentUser.email || '';
            document.getElementById('display-email').textContent = userEmail;

            // Display name fallback
            let displayName = currentUser.user_metadata?.full_name ||
                              currentUser.user_metadata?.username ||
                              (userEmail ? userEmail.split('@')[0] : 'User');

            document.getElementById('display-name').textContent = displayName;

            // Load saved avatar if exists
            const savedAvatar = localStorage.getItem('user_avatar_' + currentUser.id) ||
                                currentUser.user_metadata?.avatar_url;

            const avatarImg = document.getElementById('avatar-img');
            if (savedAvatar) {
                avatarImg.src = savedAvatar;
            } else {
                avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=6366f1&color=fff`;
            }

            // Fetch Profile Data from DB
            let profile = null;
            try {
                let { data, error } = await supabase
                    .from('user_profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                if (!error && data) profile = data;
            } catch (e) {
                console.warn('Profile fetch note:', e);
            }

            // Fallback metadata if DB has no record
            const meta = currentUser.user_metadata || {};

            document.getElementById('username').value = (profile && profile.username) || meta.username || '';
            document.getElementById('full_name').value = (profile && profile.full_name) || meta.full_name || '';
            document.getElementById('phone').value = (profile && profile.phone) || meta.phone || '';
            document.getElementById('country').value = (profile && profile.country) || meta.country || 'Egypt';
        }

        // Avatar Upload Handler
        const uploadBtn = document.getElementById('upload-btn');
        const avatarImg = document.getElementById('avatar-img');
        const fileInput = document.getElementById('avatar-file-input');

        uploadBtn.addEventListener('click', () => fileInput.click());
        avatarImg.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('Image size should be less than 5MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (evt) {
                const base64Data = evt.target.result;
                avatarImg.src = base64Data;

                if (currentUser) {
                    localStorage.setItem('user_avatar_' + currentUser.id, base64Data);

                    // Update local google_auth_user if present
                    const googleAuth = localStorage.getItem('google_auth_user');
                    if (googleAuth) {
                        try {
                            const parsed = JSON.parse(googleAuth);
                            if (parsed.user && parsed.user.user_metadata) {
                                parsed.user.user_metadata.avatar_url = base64Data;
                                localStorage.setItem('google_auth_user', JSON.stringify(parsed));
                            }
                        } catch (e) {}
                    }
                }
                alert('Profile picture updated successfully! ✅');
            };
            reader.readAsDataURL(file);
        });

        async function updateProfile(e) {
            e.preventDefault();
            if (!currentUser) return;

            const username = document.getElementById('username').value.trim();
            const full_name = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const country = document.getElementById('country').value;
            const currentAvatar = avatarImg.src;

            const updates = {
                id: currentUser.id,
                username: username || (currentUser.email ? currentUser.email.split('@')[0] : 'User'),
                full_name: full_name,
                phone: phone,
                country: country,
                avatar_url: currentAvatar,
                updated_at: new Date()
            };

            try {
                const { error } = await supabase.from('user_profiles').upsert(updates);
                if (error) console.warn('Supabase upsert note:', error.message);
            } catch (err) {
                console.warn('Upsert note:', err.message);
            }

            // Save locally
            localStorage.setItem('user_profile_' + currentUser.id, JSON.stringify(updates));
            if (updates.full_name) {
                document.getElementById('display-name').textContent = updates.full_name;
            }

            alert('Profile updated successfully! ✅');
        }

        async function signOut() {
            try {
                await supabase.auth.signOut();
            } catch (e) {}
            if (currentUser) {
                localStorage.removeItem('user_avatar_' + currentUser.id);
            }
            localStorage.removeItem('google_auth_user');
            localStorage.removeItem('project_auth_token');
            window.location.href = 'login.html';
        }

        // Init
        loadProfile();
        document.getElementById('profile-form').addEventListener('submit', updateProfile);
        document.getElementById('sign-out-btn').addEventListener('click', signOut);

    </script>
</body>

</html>
