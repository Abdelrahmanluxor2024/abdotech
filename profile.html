<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الملف الشخصي وإدارة الحساب - عبدالرحمن الأسيوطي">
    <title>الملف الشخصي | My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="profile-container">
        <!-- Navigation -->
        <nav class="nav-bar">
            <a href="index.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                <span>العودة إلى الصفحة الرئيسية</span>
            </a>
            <button id="sign-out-btn" class="sign-out-btn" type="button">تسجيل الخروج</button>
        </nav>

        <!-- Profile Header -->
        <div class="profile-header">
            <!-- Hidden native file input -->
            <input type="file" id="avatar-file-input" accept="image/*">

            <!-- Clickable Label Wrapper for 100% Cross-Device Native File Picker -->
            <label for="avatar-file-input" class="avatar-wrapper" id="avatar-container" title="اضغط لاختيار صورة من جهازك أو الموبايل">
                <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Avatar"
                    id="avatar-img" class="profile-avatar">
                <span class="avatar-upload-btn" title="تغيير الصورة">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </span>
            </label>

            <div class="profile-info">
                <h1 id="display-name">جاري التحميل...</h1>
                <p class="profile-email">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <span id="display-email">...</span>
                </p>
                <span class="profile-badge" id="account-badge">حساب نشط ✓</span>
            </div>
        </div>

        <!-- Personal Information Form -->
        <div class="profile-card">
            <h2>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>البيانات الشخصية</span>
            </h2>

            <form id="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="username">اسم المستخدم (Username)</label>
                        <input type="text" id="username" class="form-input" placeholder="اسم المستخدم" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="full_name">الاسم بالكامل (Full Name)</label>
                        <input type="text" id="full_name" class="form-input" placeholder="الاسم ثلاثي أو ثنائي">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">رقم الهاتف / الواتساب</label>
                        <input type="tel" id="phone" class="form-input" placeholder="01xxxxxxxxx" dir="ltr" style="text-align: right;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="country">المحافظة (Governorate)</label>
                        <select id="country" class="form-input">
                            <option value="Cairo">القاهرة (Cairo)</option>
                            <option value="Giza">الجيزة (Giza)</option>
                            <option value="Alexandria">الإسكندرية (Alexandria)</option>
                            <option value="Luxor" selected>الأقصر (Luxor)</option>
                            <option value="Aswan">أسوان (Aswan)</option>
                            <option value="Qena">قنا (Qena)</option>
                            <option value="Sohag">سوهاج (Sohag)</option>
                            <option value="Assiut">أسيوط (Assiut)</option>
                            <option value="Minya">المنيا (Minya)</option>
                            <option value="Beni Suef">بني سويف (Beni Suef)</option>
                            <option value="Fayoum">الفيوم (Fayoum)</option>
                            <option value="Qalyubia">القليوبية (Qalyubia)</option>
                            <option value="Sharqia">الشرقية (Sharqia)</option>
                            <option value="Dakahlia">الدقهلية (Dakahlia)</option>
                            <option value="Monufia">المنوفية (Monufia)</option>
                            <option value="Gharbia">الغربية (Gharbia)</option>
                            <option value="Kafr El Sheikh">كفر الشيخ (Kafr El Sheikh)</option>
                            <option value="Damietta">دمياط (Damietta)</option>
                            <option value="Port Said">بورسعيد (Port Said)</option>
                            <option value="Ismailia">الإسماعيلية (Ismailia)</option>
                            <option value="Suez">السويس (Suez)</option>
                            <option value="North Sinai">شمال سيناء (North Sinai)</option>
                            <option value="South Sinai">جنوب سيناء (South Sinai)</option>
                            <option value="Red Sea">البحر الأحمر (Red Sea)</option>
                            <option value="New Valley">الوادي الجديد (New Valley)</option>
                            <option value="Matrouh">مطروح (Matrouh)</option>
                            <option value="Beheira">البحيرة (Beheira)</option>
                            <option value="Outside Egypt">خارج مصر (Outside Egypt 🌍)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-save" id="save-btn">حفظ التغييرات</button>
            </form>
        </div>
    </div>

    <!-- MAIN PROFILE SCRIPT -->
    <script>
        // --- Supabase Client Config ---
        const SUPABASE_URL = 'https://bebudhdiylpxrmddrhyp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlYnVkaGRpeWxweHJtZGRyaHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0ODI4NTksImV4cCI6MjA5ODA1ODg1OX0.LB6-Tg7QdOertHK3eEue966iblIgVzO7982-WAg2bVM';
        
        let supabase = null;
        if (window.supabase && window.supabase.createClient) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: {
                    persistSession: true,
                    storageKey: 'project_auth_token',
                    storage: window.localStorage,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            });
        }

        let currentUser = null;
        let activeProfile = {};

        // Toast Message Notification
        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 350);
            }, 3500);
        }

        // 1. Instant Synchronous Load from Local Storage Cache
        function loadCachedProfile() {
            let found = false;

            // Check active_user_session
            const activeRaw = localStorage.getItem('active_user_session');
            if (activeRaw) {
                try {
                    const parsed = JSON.parse(activeRaw);
                    if (parsed && (parsed.email || parsed.username)) {
                        activeProfile = parsed;
                        found = true;
                    }
                } catch(e) {}
            }

            // Check project_auth_token
            if (!found) {
                const tokenRaw = localStorage.getItem('project_auth_token');
                if (tokenRaw) {
                    try {
                        const parsed = JSON.parse(tokenRaw);
                        if (parsed && parsed.user) {
                            const u = parsed.user;
                            const m = u.user_metadata || {};
                            activeProfile = {
                                id: u.id,
                                email: u.email,
                                username: m.username || u.email.split('@')[0],
                                full_name: m.full_name || m.username || '',
                                phone: m.phone || '',
                                country: m.country || 'Luxor',
                                avatar_url: m.avatar_url || ''
                            };
                            found = true;
                        }
                    } catch(e) {}
                }
            }

            // Check google_auth_user
            if (!found) {
                const googleRaw = localStorage.getItem('google_auth_user');
                if (googleRaw) {
                    try {
                        const parsed = JSON.parse(googleRaw);
                        if (parsed && parsed.user) {
                            const u = parsed.user;
                            const m = u.user_metadata || {};
                            activeProfile = {
                                id: u.id,
                                email: u.email,
                                username: m.full_name || u.email.split('@')[0],
                                full_name: m.full_name || '',
                                phone: '',
                                country: 'Cairo',
                                avatar_url: m.avatar_url || ''
                            };
                            found = true;
                        }
                    } catch(e) {}
                }
            }

            // Check last_registered_profile
            if (!found) {
                const lastReg = localStorage.getItem('last_registered_profile');
                if (lastReg) {
                    try {
                        const parsed = JSON.parse(lastReg);
                        if (parsed && (parsed.email || parsed.username)) {
                            activeProfile = parsed;
                            found = true;
                        }
                    } catch(e) {}
                }
            }

            if (found) {
                applyProfileToDOM(activeProfile);
            }
            return found;
        }

        // Render profile object into HTML elements
        function applyProfileToDOM(prof) {
            if (!prof) return;

            const nameEl = document.getElementById('display-name');
            const emailEl = document.getElementById('display-email');
            const usernameInput = document.getElementById('username');
            const fullNameInput = document.getElementById('full_name');
            const phoneInput = document.getElementById('phone');
            const countrySelect = document.getElementById('country');
            const avatarImg = document.getElementById('avatar-img');

            const displayName = prof.username || prof.full_name || (prof.email ? prof.email.split('@')[0] : 'المستخدم');
            if (nameEl) nameEl.textContent = displayName;
            if (emailEl) emailEl.textContent = prof.email || 'حساب مفعل';

            if (usernameInput && prof.username) usernameInput.value = prof.username;
            else if (usernameInput && prof.email) usernameInput.value = prof.email.split('@')[0];

            if (fullNameInput) fullNameInput.value = prof.full_name || prof.username || '';
            if (phoneInput) phoneInput.value = prof.phone || '';

            if (countrySelect && prof.country) {
                for (let i = 0; i < countrySelect.options.length; i++) {
                    if (countrySelect.options[i].value.toLowerCase() === prof.country.toLowerCase()) {
                        countrySelect.selectedIndex = i;
                        break;
                    }
                }
            }

            // Avatar resolution
            const userId = prof.id || 'default_user';
            const savedAvatar = localStorage.getItem('user_avatar_' + userId) ||
                                prof.avatar_url ||
                                localStorage.getItem('user_avatar_global');

            if (avatarImg) {
                if (savedAvatar) {
                    avatarImg.src = savedAvatar;
                } else {
                    avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=6366f1&color=fff`;
                }
            }
        }

        // 2. Asynchronous Session Fetch from Supabase Client
        async function fetchFullProfile() {
            if (!supabase) return;

            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session && session.user) {
                    currentUser = session.user;
                    const meta = session.user.user_metadata || {};

                    // Fetch user_profiles row
                    let dbProfile = null;
                    try {
                        const { data } = await supabase
                            .from('user_profiles')
                            .select('*')
                            .eq('id', session.user.id)
                            .single();
                        if (data) dbProfile = data;
                    } catch(err) {}

                    activeProfile = {
                        id: session.user.id,
                        email: session.user.email,
                        username: (dbProfile && dbProfile.username) || meta.username || session.user.email.split('@')[0],
                        full_name: (dbProfile && dbProfile.full_name) || meta.full_name || meta.username || '',
                        phone: (dbProfile && dbProfile.phone) || meta.phone || '',
                        country: (dbProfile && dbProfile.country) || meta.country || 'Luxor',
                        avatar_url: (dbProfile && dbProfile.avatar_url) || meta.avatar_url || ''
                    };

                    localStorage.setItem('active_user_session', JSON.stringify(activeProfile));
                    localStorage.setItem('user_profile_' + session.user.id, JSON.stringify(activeProfile));
                    applyProfileToDOM(activeProfile);
                }
            } catch(e) {
                console.warn('Supabase fetch note:', e);
            }
        }

        // 3. Avatar Upload Handler (Desktop & Mobile)
        const fileInput = document.getElementById('avatar-file-input');
        const avatarImg = document.getElementById('avatar-img');
        const avatarContainer = document.getElementById('avatar-container');

        if (fileInput) {
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showToast('يرجى اختيار ملف صورة صالح (PNG, JPG, WEBP)', 'error');
                    return;
                }

                if (file.size > 8 * 1024 * 1024) {
                    showToast('حجم الصورة كبير جداً (الحد الأقصى 8 ميجابايت)', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64Data = evt.target.result;
                    if (avatarImg) avatarImg.src = base64Data;

                    activeProfile.avatar_url = base64Data;
                    const userId = activeProfile.id || 'default_user';

                    localStorage.setItem('user_avatar_' + userId, base64Data);
                    localStorage.setItem('user_avatar_global', base64Data);
                    localStorage.setItem('active_user_session', JSON.stringify(activeProfile));

                    // Sync with Supabase table if possible
                    if (supabase && activeProfile.id) {
                        supabase.from('user_profiles').upsert([
                            { id: activeProfile.id, avatar_url: base64Data, updated_at: new Date() }
                        ]).then(() => {}).catch(() => {});
                    }

                    showToast('تم تحديث الصورة الشخصية بنجاح! ✅', 'success');
                };
                reader.readAsDataURL(file);
            });
        }

        // 4. Save Profile Changes Handler
        const profileForm = document.getElementById('profile-form');
        if (profileForm) {
            profileForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const saveBtn = document.getElementById('save-btn');
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.textContent = 'جاري الحفظ...';
                }

                const usernameVal = document.getElementById('username').value.trim();
                const fullNameVal = document.getElementById('full_name').value.trim();
                const phoneVal = document.getElementById('phone').value.trim();
                const countryVal = document.getElementById('country').value;
                const avatarVal = avatarImg ? avatarImg.src : '';

                activeProfile.username = usernameVal || activeProfile.username;
                activeProfile.full_name = fullNameVal;
                activeProfile.phone = phoneVal;
                activeProfile.country = countryVal;
                activeProfile.avatar_url = avatarVal;

                const userId = activeProfile.id || 'default_user';

                // Save to localStorage
                localStorage.setItem('active_user_session', JSON.stringify(activeProfile));
                localStorage.setItem('user_profile_' + userId, JSON.stringify(activeProfile));
                localStorage.setItem('last_registered_profile', JSON.stringify(activeProfile));

                // Save to Supabase
                if (supabase && activeProfile.id) {
                    try {
                        await supabase.from('user_profiles').upsert([{
                            id: activeProfile.id,
                            username: activeProfile.username,
                            full_name: activeProfile.full_name,
                            phone: activeProfile.phone,
                            country: activeProfile.country,
                            avatar_url: activeProfile.avatar_url,
                            updated_at: new Date()
                        }]);

                        if (supabase.auth.updateUser) {
                            await supabase.auth.updateUser({
                                data: {
                                    username: activeProfile.username,
                                    full_name: activeProfile.full_name,
                                    phone: activeProfile.phone,
                                    country: activeProfile.country
                                }
                            });
                        }
                    } catch(err) {
                        console.warn('Supabase profile update:', err);
                    }
                }

                applyProfileToDOM(activeProfile);

                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'حفظ التغييرات';
                }

                showToast('تم حفظ التعديلات بنجاح! ✅', 'success');
            });
        }

        // 5. Sign Out Handler (Instant & Clean)
        const signOutBtn = document.getElementById('sign-out-btn');
        if (signOutBtn) {
            signOutBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                signOutBtn.textContent = 'جاري الخروج...';
                signOutBtn.disabled = true;

                // Sign out in background
                if (supabase && supabase.auth) {
                    try {
                        supabase.auth.signOut().catch(() => {});
                    } catch(e) {}
                }

                // Clear all local auth caches
                localStorage.removeItem('active_user_session');
                localStorage.removeItem('project_auth_token');
                localStorage.removeItem('google_auth_user');
                sessionStorage.clear();

                window.location.replace('login.html');
            });
        }

        // Initial Executions
        const hasCached = loadCachedProfile();
        fetchFullProfile();

        // If no user found anywhere after checks, redirect
        setTimeout(() => {
            if (!localStorage.getItem('active_user_session') &&
                !localStorage.getItem('project_auth_token') &&
                !localStorage.getItem('google_auth_user') &&
                !localStorage.getItem('last_registered_profile')) {
                window.location.replace('login.html');
            }
        }, 1200);

    </script>
</body>

</html>
